<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Note for You</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0b132b;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .font-handwriting {
            font-family: 'Caveat', cursive;
        }

        /* Latar Belakang Pemandangan Alam & Malam Maskulin */
        .bg-scenery {
            background-image: 
                linear-gradient(to bottom, rgba(11, 19, 43, 0.75), rgba(28, 37, 65, 0.85)),
                url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Kartu Kaca Warna Masculine / Cool Slate */
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 25px rgba(14, 165, 233, 0.15);
        }
        
        .fade-in {
            animation: fadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Ambient Glowing Orbs - Ocean Blue & Cyan */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.35;
            animation: orbFloat 14s infinite alternate ease-in-out;
            pointer-events: none;
        }
        .orb-1 {
            top: -10%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #0ea5e9 0%, #1e3a8a 100%);
        }
        .orb-2 {
            bottom: -10%;
            right: -10%;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #0284c7 0%, #0f172a 100%);
            animation-delay: -7s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.12); }
        }

        /* Animasi Countdown Overlay */
        .countdown-pulse {
            animation: pulseScale 0.8s ease-in-out infinite alternate;
        }
        @keyframes pulseScale {
            0% { transform: scale(0.85); opacity: 0.6; }
            100% { transform: scale(1.15); opacity: 1; }
        }
    </style>
</head>
<body class="bg-scenery text-slate-100 flex items-center justify-center p-4 min-h-screen relative overflow-x-hidden">

    <!-- Glowing Orbs Background (Cool Cyan / Ocean Tone) -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Container Utama -->
    <main class="w-full max-w-md mx-auto relative z-10">

        <!-- Audio Player Visual Controller (Muncul di Step 3 saat lagu diputar) -->
        <div id="audioControls" class="hidden mb-4 glass-card rounded-2xl p-3.5 flex items-center justify-between text-xs text-sky-200">
            <div class="flex items-center space-x-3">
                <button id="toggleAudioBtn" onclick="toggleAudio()" class="w-9 h-9 rounded-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:scale-105 flex items-center justify-center text-white transition shadow-lg shadow-cyan-500/30">
                    <i id="audioIcon" class="fas fa-pause"></i>
                </button>
                <div class="truncate">
                    <p class="font-semibold truncate text-white" id="songTitle">Music Ambience</p>
                    <p class="text-[10px] text-sky-300/80" id="songArtist">Pilihan Lagu Sukses Diputar</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">
                <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="text-[10px] font-medium text-emerald-300">Playing</span>
            </div>
        </div>

        <!-- STEP 1: INPUT NAMA -->
        <section id="step1" class="glass-card rounded-3xl p-6 sm:p-8 text-center fade-in">
            <div class="w-16 h-16 bg-gradient-to-tr from-cyan-500/20 to-blue-600/20 rounded-2xl flex items-center justify-center mx-auto mb-5 text-cyan-400 text-2xl border border-cyan-500/30 shadow-inner">
                <i class="fas fa-compass"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white mb-2">Halo Brooook 👋</h1>
            <p class="text-slate-300 text-xs sm:text-sm mb-6 leading-relaxed">Sebelum lanjut, boleh isi nama kamu dulu di bawah ini?</p>
            
            <form onsubmit="goToStep2(event)" class="space-y-4">
                <div class="text-left">
                    <label for="userName" class="block text-xs font-medium text-cyan-200 mb-1.5 pl-1">Nama Kamu</label>
                    <input type="text" id="userName" required placeholder="Tulis namamu..."
                           class="w-full px-4 py-3.5 rounded-xl bg-slate-950/70 border border-cyan-500/30 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-400 transition text-sm">
                </div>
                <button type="submit" class="w-full py-3.5 px-4 bg-gradient-to-r from-sky-600 via-blue-600 to-indigo-600 hover:opacity-95 text-white font-semibold rounded-xl shadow-lg shadow-sky-600/30 transition duration-200 transform active:scale-95 text-sm flex items-center justify-center gap-2">
                    Lanjut <i class="fas fa-arrow-right text-xs"></i>
                </button>
            </form>
        </section>

        <!-- STEP 2: INPUT POV -->
        <section id="step2" class="glass-card rounded-3xl p-6 sm:p-8 hidden fade-in">
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-cyan-500/20 rounded-xl flex items-center justify-center mx-auto mb-3 text-cyan-400 text-xl border border-cyan-500/30">
                    <i class="fas fa-comment-dots"></i>
                </div>
                <h2 class="text-xl font-bold text-white">Yo, <span id="displayNameStep2" class="text-cyan-400"></span>! 🙌</h2>
                <p class="text-slate-300 text-xs mt-1">Gimana POV / penilaian kamu tentang aku?</p>
            </div>

            <form onsubmit="startTransitionToStep3(event)" class="space-y-4">
                <div>
                    <label for="userPOV" class="block text-xs font-medium text-cyan-200 mb-1.5 pl-1">Tulis POV kamu secara jujur di sini:</label>
                    <textarea id="userPOV" rows="4" required placeholder="Menurutku kamu itu orangnya..."
                              class="w-full px-4 py-3 rounded-xl bg-slate-950/70 border border-cyan-500/30 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-400 transition text-sm resize-none"></textarea>
                </div>

                <button type="submit" class="w-full py-3.5 px-4 bg-gradient-to-r from-sky-600 via-blue-600 to-indigo-600 hover:opacity-95 text-white font-semibold rounded-xl shadow-lg shadow-sky-600/30 transition duration-200 transform active:scale-95 text-sm flex items-center justify-center gap-2 mt-4">
                    Kirim & Buka Pesan Spesial <i class="fas fa-paper-plane text-xs"></i>
                </button>
            </form>
        </section>

        <!-- STEP ANIMATION: COUNTDOWN OVERLAY 3, 2, 1 -->
        <section id="countdownStep" class="glass-card rounded-3xl p-10 text-center hidden fade-in flex flex-col items-center justify-center min-h-[300px]">
            <p class="text-xs font-semibold tracking-widest text-cyan-300 uppercase mb-4">Menyiapkan Pesan Spesial...</p>
            <div id="countdownNumber" class="text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 countdown-pulse">
                3
            </div>
        </section>

        <!-- STEP 3: KARTU QUOTES DARI KAMU & MUSIK OTOMATIS -->
        <section id="step3" class="hidden fade-in">
            <div class="glass-card rounded-3xl p-6 sm:p-8 border border-cyan-400/30 relative overflow-hidden">
                
                <!-- Tag Header To -->
                <div class="flex items-center justify-between border-b border-white/10 pb-4 mb-6">
                    <div>
                        <span class="text-[10px] uppercase tracking-widest text-cyan-400 font-semibold block">Message For You</span>
                        <h3 class="text-lg font-bold text-white flex items-center gap-2">
                            Untuk: <span id="finalTargetName" class="text-cyan-400 underline decoration-sky-500 decoration-wavy"></span>
                        </h3>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-cyan-500/20 flex items-center justify-center text-cyan-300 border border-cyan-500/30">
                        <i class="fas fa-quote-left"></i>
                    </div>
                </div>

                <!-- Quote / Pesan Spesial Kamu -->
                <div class="my-6 min-h-[140px] flex items-center justify-center text-center px-2">
                    <blockquote class="space-y-3">
                        <i class="fas fa-quote-left text-2xl text-cyan-400/40 block"></i>
                        <p id="quoteText" class="text-base sm:text-lg text-slate-100 font-medium leading-relaxed italic"></p>
                        <i class="fas fa-quote-right text-2xl text-cyan-400/40 block"></i>
                    </blockquote>
                </div>

                <!-- Tombol Action -->
                <div class="space-y-3 pt-2">
                    <button onclick="getRandomQuote()" class="w-full py-3 px-4 bg-cyan-500/20 hover:bg-cyan-500/30 border border-cyan-500/40 text-cyan-200 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2">
                        <i class="fas fa-shuffle"></i> Ganti Kata-Kata Lain
                    </button>

                    <button onclick="resetApp()" class="w-full py-2 px-4 bg-transparent hover:bg-white/5 text-slate-400 text-xs font-medium rounded-xl transition">
                        Ulang Dari Awal
                    </button>
                </div>
            </div>
        </section>

    </main>

    <script>
        // Konfigurasi Formspree ID milikmu
        const FORMSPREE_FORM_ID = 'xyeebjqv';

        const MY_SONG_FILE = 'The 1975 - About You (Official).mp3'; // File musik milikmu
        const MY_SONG_TITLE = 'About You'; // Judul yang tampil di pemutar musik
        const MY_SONG_ARTIST = 'The 1975';

        // Quotes/Kata-Kata Baru Dari Kamu Untuk Teman
        const quotesList = [
            "istirahat sejenak itu wajar, tapi jangan menyerah.. Ingat sudah sejauh mana kamu melangkah sejauh ini..",
            "kesempatan besar tidak datang dua kali.. Kegagalan terbaik adalah ketika kamu sudah berani mencoba..",
            "fokus pada prosesnya, hasil terbaik akan menyulut kerja kerasmu nanti.. Semangat!!",
            "jangan pernah ragu sama kemampuan kamu.. Kamu itu jauh lebih hebat dari yang kamu bayangkan..",
            "percaya pada proses, pelan pelan yang penting sampai..",
            "mungkin kamu capek bukan karena hidupmu, melainkan karena terlalu lama menjadi seseorang yang bukan dirimu..",
            "hapus air matamu, lepaskan versi lama dari dirimu, bangun kembali menjadi seseorang yang lebih kuat!!",
            "jangan lupakan masa lalu, tpi pandang dengan perspektif yang tak menyakitkan agar kita bisa berkembang dari luka luka itu.."
        ];

        let state = {
            name: '',
            pov: '',
            isPlaying: false
        };

        // Audio Element
        let audioElement = new Audio();
        audioElement.loop = true;
        audioElement.preload = 'auto';

        // Panggil preload saat halaman dimuat agar siap diputar otomatis
        audioElement.src = MY_SONG_FILE;

        function playStep3Music() {
            state.isPlaying = true;
            document.getElementById('songTitle').innerText = MY_SONG_TITLE;
            document.getElementById('songArtist').innerText = MY_SONG_ARTIST;
            document.getElementById('audioControls').classList.remove('hidden');

            audioElement.src = MY_SONG_FILE;
            
            // Putar musik secara otomatis
            const playPromise = audioElement.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    document.getElementById('audioIcon').className = 'fas fa-pause';
                }).catch(e => {
                    console.log("Autoplay terhalang browser, mendengarkan gestur pengguna...", e);
                    // Jika terhalang batasan browser, putar otomatis saat pengguna menyentuh/mengklik layar
                    const enableAudioOnUserGesture = () => {
                        audioElement.play().then(() => {
                            document.getElementById('audioIcon').className = 'fas fa-pause';
                        });
                        document.removeEventListener('click', enableAudioOnUserGesture);
                        document.removeEventListener('touchstart', enableAudioOnUserGesture);
                    };
                    document.addEventListener('click', enableAudioOnUserGesture, { once: true });
                    document.addEventListener('touchstart', enableAudioOnUserGesture, { once: true });
                });
            }
        }

        function stopAudio() {
            state.isPlaying = false;
            audioElement.pause();
            document.getElementById('audioIcon').className = 'fas fa-play';
        }

        function toggleAudio() {
            if (audioElement.paused) {
                audioElement.play();
                state.isPlaying = true;
                document.getElementById('audioIcon').className = 'fas fa-pause';
            } else {
                audioElement.pause();
                state.isPlaying = false;
                document.getElementById('audioIcon').className = 'fas fa-play';
            }
        }

        // Navigation Handlers
        function goToStep2(e) {
            e.preventDefault();
            const nameInput = document.getElementById('userName').value.trim();
            if (!nameInput) return;

            state.name = nameInput;
            document.getElementById('displayNameStep2').innerText = state.name;

            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        // Transisi 3-2-1 dari Step 2 ke Step 3
        function startTransitionToStep3(e) {
            e.preventDefault();
            const povInput = document.getElementById('userPOV').value.trim();
            if (!povInput) return;

            state.pov = povInput;

            // Kirim pesan otomatis ke Email kamu via Formspree
            sendEmailNotification(state.name, state.pov);

            // Sembunyikan Step 2 dan Tampilkan Overlay Countdown
            document.getElementById('step2').classList.add('hidden');
            const countdownStep = document.getElementById('countdownStep');
            const countdownEl = document.getElementById('countdownNumber');
            countdownStep.classList.remove('hidden');

            let count = 3;
            countdownEl.innerText = count;

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownEl.innerText = count;
                } else {
                    clearInterval(timer);
                    // Masuk ke Step 3
                    countdownStep.classList.add('hidden');
                    document.getElementById('finalTargetName').innerText = state.name;
                    getRandomQuote();
                    playStep3Music();
                    document.getElementById('step3').classList.remove('hidden');
                }
            }, 900);
        }

        // Fungsi Otomatis Mengirim Pesan POV ke Email Kamu
        function sendEmailNotification(name, pov) {
            if (!FORMSPREE_FORM_ID || FORMSPREE_FORM_ID === "GANTI_DENGAN_FORMSPREE_ID_KAMU") {
                console.log("Formspree ID belum diisi.");
                return;
            }

            const url = `https://formspree.io/f/${FORMSPREE_FORM_ID}`;

            fetch(url, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    nama: name,
                    pesan_pov: pov,
                    _subject: `Pesan POV Baru dari ${name}!`
                })
            }).then(response => {
                if(response.ok) {
                    console.log("Pesan berhasil terkirim ke email!");
                }
            }).catch(err => console.error("Gagal mengirim pesan ke email:", err));
        }

        function getRandomQuote() {
            const quoteEl = document.getElementById('quoteText');
            const randomIndex = Math.floor(Math.random() * quotesList.length);
            quoteEl.innerText = quotesList[randomIndex];
        }

        function resetApp() {
            stopAudio();
            document.getElementById('audioControls').classList.add('hidden');
            document.getElementById('userName').value = '';
            document.getElementById('userPOV').value = '';
            
            document.getElementById('step3').classList.add('hidden');
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('countdownStep').classList.add('hidden');
            document.getElementById('step1').classList.remove('hidden');
        }
    </script>
</body>
</html>
